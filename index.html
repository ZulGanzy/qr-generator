<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="image.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">
          <i class="fas fa-qrcode"></i>
          QR Code Generator
        </h1>
        <p class="subtitle">Create QR codes easily and quickly</p>
      </header>

      <main class="main-content">
        <form id="qrForm" class="qr-form">
          <div class="input-group">
            <input type="text" name="text" id="text" placeholder="Enter text or URL for QR code" required />
            <button type="submit" class="generate-btn">
              <i class="fas fa-magic"></i>
              <span>Generate QR Code</span>
            </button>
          </div>
        </form>

        <div id="result" class="result-section">
          <div id="qrcode" class="qr-display"></div>
          <div class="qr-actions">
            <button id="previewBtn" class="action-btn preview-btn" style="display: none">
              <i class="fas fa-eye"></i>
              <span>Preview</span>
            </button>
            <button id="downloadBtn" class="action-btn download-btn" style="display: none">
              <i class="fas fa-download"></i>
              <span>Download</span>
            </button>
            <button id="saveBtn" class="action-btn save-btn" style="display: none">
              <i class="fas fa-save"></i>
              <span>Save</span>
            </button>
          </div>
        </div>

        <section class="saved-section">
          <h3 class="section-title">
            <i class="fas fa-history"></i>
            Saved QR Codes
          </h3>
          <div id="savedQrs" class="saved-grid"></div>
        </section>
      </main>
    </div>

    <div id="qrModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">
            <i class="fas fa-eye"></i>
            QR Code Preview
          </h3>
          <button id="closeModal" class="close-modal" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-qr-display">
          <div class="qr-preview-container">
            <img id="modalQrImg" src="" alt="QR Code Preview" />
          </div>
          <div id="modalQrText" class="modal-qr-text"></div>
        </div>
        <div class="modal-actions">
          <button id="modalDownload" class="btn btn-primary">
            <i class="fas fa-download"></i>
            <span>Download</span>
          </button>
          <button id="modalDelete" class="btn btn-secondary">
            <i class="fas fa-trash"></i>
            <span>Delete</span>
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <p>
          <i class="fas fa-code"></i>
          Made by <strong>ZulGanzy</strong> &copy; 2025
        </p>
        <ul class="footer-links">
          <li>
            <a href="https://github.com/ZulGanzy/" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-github"></i>
              <span>GitHub</span>
            </a>
          </li>
          <li>
            <a href="https://instagram.com/zullsaha" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-instagram"></i>
              <span>Instagram</span>
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
