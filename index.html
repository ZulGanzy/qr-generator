<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">
          <i class="fas fa-qrcode"></i>
          QR Code Generator
        </h1>
        <p class="subtitle">Create QR codes easily and quickly</p>
      </header>

      <main class="main-content">
        <form id="qrForm" class="qr-form">
          <div class="input-group">
            <input type="text" name="text" id="text" placeholder="Enter text or URL for QR code" required />
            <button type="submit" class="generate-btn">
              <i class="fas fa-magic"></i>
              <span>Generate QR Code</span>
            </button>
          </div>
        </form>

        <div class="workspace">
          <div class="styling-panel">
            <button type="button" class="styling-toggle" id="stylingToggle">
              <i class="fas fa-palette"></i>
              <span>QR Styling</span>
              <i class="fas fa-chevron-down toggle-icon"></i>
            </button>
            <div class="styling-body" id="stylingBody">

              <div class="styling-section-title">Colors</div>
              <div class="styling-row">
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-fill-drip"></i>
                    Dot
                  </label>
                  <div class="color-input-wrap">
                    <input type="color" id="qrDotColor" value="#000000" />
                    <input type="text" class="color-hex" id="qrDotHex" value="#000000" maxlength="7" spellcheck="false" />
                  </div>
                </div>
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-vector-square"></i>
                    Corner Sq
                  </label>
                  <div class="color-input-wrap">
                    <input type="color" id="qrCsColor" value="#000000" />
                    <input type="text" class="color-hex" id="qrCsHex" value="#000000" maxlength="7" spellcheck="false" />
                  </div>
                </div>
              </div>

              <div class="styling-row">
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-circle"></i>
                    Corner Dot
                  </label>
                  <div class="color-input-wrap">
                    <input type="color" id="qrCdColor" value="#000000" />
                    <input type="text" class="color-hex" id="qrCdHex" value="#000000" maxlength="7" spellcheck="false" />
                  </div>
                </div>
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-fill"></i>
                    Background
                  </label>
                  <div class="color-input-wrap">
                    <input type="color" id="qrBgColor" value="#ffffff" />
                    <input type="text" class="color-hex" id="qrBgHex" value="#ffffff" maxlength="7" spellcheck="false" />
                  </div>
                </div>
              </div>

              <div class="styling-section-title">Styles</div>
              <div class="styling-group">
                <label class="styling-label">
                  <i class="fas fa-shapes"></i>
                  Dot Style
                </label>
                <div class="style-options" id="dotStyleOptions">
                  <button type="button" class="style-opt active" data-value="square" title="Square">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /></svg>
                  </button>
                  <button type="button" class="style-opt" data-value="rounded" title="Rounded">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2" /><rect x="14" y="3" width="7" height="7" rx="2" /><rect x="3" y="14" width="7" height="7" rx="2" /><rect x="14" y="14" width="7" height="7" rx="2" /></svg>
                  </button>
                  <button type="button" class="style-opt" data-value="dots" title="Dots">
                    <svg viewBox="0 0 24 24"><circle cx="6.5" cy="6.5" r="4" /><circle cx="17.5" cy="6.5" r="4" /><circle cx="6.5" cy="17.5" r="4" /><circle cx="17.5" cy="17.5" r="4" /></svg>
                  </button>
                  <button type="button" class="style-opt" data-value="extra-rounded" title="Extra Rounded">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="3.5" /><rect x="14" y="3" width="7" height="7" rx="3.5" /><rect x="3" y="14" width="7" height="7" rx="3.5" /><rect x="14" y="14" width="7" height="7" rx="3.5" /></svg>
                  </button>
                  <button type="button" class="style-opt" data-value="classy" title="Classy">
                    <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3z" /><path d="M14 3h7v7h-7z" /><path d="M3 14h7v7H3z" /><path d="M14 14h7v7h-7z" /></svg>
                  </button>
                  <button type="button" class="style-opt" data-value="classy-rounded" title="Classy Rounded">
                    <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3z" /><path d="M14 3h7v7h-7z" /><path d="M3 14h7v7H3z" /><path d="M14 14h7v7h-7z" /></svg>
                  </button>
                </div>
              </div>

              <div class="styling-row">
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-vector-square"></i>
                    Corner Sq
                  </label>
                  <div class="style-options" id="cornerSquareOptions">
                    <button type="button" class="style-opt active" data-value="square" title="Square">
                      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" /><rect x="7" y="7" width="10" height="10" /></svg>
                    </button>
                    <button type="button" class="style-opt" data-value="dot" title="Dot">
                      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="5" /></svg>
                    </button>
                    <button type="button" class="style-opt" data-value="extra-rounded" title="Extra Rounded">
                      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2" /><rect x="7" y="7" width="10" height="10" rx="3" /></svg>
                    </button>
                  </div>
                </div>
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-circle"></i>
                    Corner Dot
                  </label>
                  <div class="style-options" id="cornerDotOptions">
                    <button type="button" class="style-opt active" data-value="square" title="Square">
                      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" /></svg>
                    </button>
                    <button type="button" class="style-opt" data-value="dot" title="Dot">
                      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" /></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div class="styling-section-title">Options</div>
              <div class="styling-group">
                <label class="styling-label">
                  <i class="fas fa-expand-arrows-alt"></i>
                  Size
                </label>
                <div class="slider-wrap">
                  <input type="range" id="qrSize" min="150" max="500" value="250" step="10" />
                  <span class="slider-val" id="qrSizeVal">250px</span>
                </div>
              </div>

              <div class="styling-row">
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-shield-alt"></i>
                    Error Correction
                  </label>
                  <div class="error-level-group">
                    <button type="button" class="err-opt" data-value="L" title="7%">L</button>
                    <button type="button" class="err-opt" data-value="M" title="15%">M</button>
                    <button type="button" class="err-opt" data-value="Q" title="25%">Q</button>
                    <button type="button" class="err-opt active" data-value="H" title="30%">H</button>
                  </div>
                </div>
                <div class="styling-group">
                  <label class="styling-label">
                    <i class="fas fa-download"></i>
                    Download Qlty
                  </label>
                  <div class="error-level-group">
                    <button type="button" class="dl-opt" data-value="1" title="1x">1x</button>
                    <button type="button" class="dl-opt active" data-value="2" title="2x">2x</button>
                    <button type="button" class="dl-opt" data-value="4" title="4x">4x</button>
                    <button type="button" class="dl-opt" data-value="8" title="8x">8x</button>
                  </div>
                </div>
              </div>

              <div class="styling-group">
                <label class="styling-label">
                  <i class="fas fa-border-all"></i>
                  Download Margin
                </label>
                <div class="slider-wrap">
                  <input type="range" id="dlMargin" min="0" max="50" value="2" step="2" />
                  <span class="slider-val" id="dlMarginVal">2px</span>
                </div>
              </div>

              <div class="styling-section-title">Logo</div>
              <div class="styling-group">
                <div class="logo-upload-area">
                  <input type="file" id="logoUpload" accept="image/*" hidden />
                  <div class="logo-preview-wrap" id="logoPreviewWrap" style="display: none;">
                    <img id="logoPreview" src="" alt="Logo" />
                    <button type="button" class="logo-remove" id="logoRemove" title="Remove logo">
                      <i class="fas fa-times"></i>
                    </button>
                  </div>
                  <button type="button" class="logo-upload-btn" id="logoUploadBtn">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Upload Logo</span>
                  </button>
                </div>
                <div class="styling-row" id="logoSlidersWrap" style="display: none; margin-top: 12px;">
                  <div class="styling-group" style="margin-bottom: 0;">
                    <label class="styling-label" style="font-size: 0.7rem;">
                      <i class="fas fa-compress-arrows-alt"></i>
                      Size
                    </label>
                    <div class="slider-wrap">
                      <input type="range" id="logoSize" min="10" max="50" value="35" step="1" />
                      <span class="slider-val" id="logoSizeVal">35%</span>
                    </div>
                  </div>
                  <div class="styling-group" style="margin-bottom: 0;">
                    <label class="styling-label" style="font-size: 0.7rem;">
                      <i class="fas fa-arrows-alt-h"></i>
                      Margin
                    </label>
                    <div class="slider-wrap">
                      <input type="range" id="logoMargin" min="0" max="15" value="4" step="1" />
                      <span class="slider-val" id="logoMarginVal">4px</span>
                    </div>
                  </div>
                </div>
              </div>

              <button type="button" class="reset-style-btn" id="resetStyleBtn">
                <i class="fas fa-undo"></i>
                <span>Reset Styles</span>
              </button>
            </div>
          </div>

          <div id="result" class="result-section">
            <div id="qrcode" class="qr-display"></div>
            <div class="qr-actions">
              <button id="previewBtn" class="action-btn preview-btn" style="display: none">
                <i class="fas fa-eye"></i>
                <span>Preview</span>
              </button>
              <button id="downloadBtn" class="action-btn download-btn" style="display: none">
                <i class="fas fa-download"></i>
                <span>Download</span>
              </button>
              <button id="saveBtn" class="action-btn save-btn" style="display: none">
                <i class="fas fa-save"></i>
                <span>Save</span>
              </button>
            </div>
          </div>
        </div>

        <section class="saved-section">
          <h3 class="section-title">
            <i class="fas fa-history"></i>
            Saved QR Codes
          </h3>
          <div id="savedQrs" class="saved-grid"></div>
        </section>
      </main>
    </div>

    <div id="qrModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">
            <i class="fas fa-eye"></i>
            QR Code Preview
          </h3>
          <button id="closeModal" class="close-modal" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-qr-display">
          <div class="qr-preview-container">
            <img id="modalQrImg" src="" alt="QR Code Preview" />
          </div>
          <div id="modalQrText" class="modal-qr-text"></div>
        </div>
        <div class="modal-actions">
          <button id="modalDownload" class="btn btn-primary">
            <i class="fas fa-download"></i>
            <span>Download</span>
          </button>
          <button id="modalDelete" class="btn btn-secondary">
            <i class="fas fa-trash"></i>
            <span>Delete</span>
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <p>
          <i class="fas fa-code"></i>
          Made by <strong>ZulGanzy</strong> &copy; 2025
        </p>
        <ul class="footer-links">
          <li>
            <a href="https://github.com/ZulGanzy/" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-github"></i>
              <span>GitHub</span>
            </a>
          </li>
          <li>
            <a href="https://instagram.com/zullsaha" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-instagram"></i>
              <span>Instagram</span>
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
